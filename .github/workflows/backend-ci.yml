name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "02_dataset/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "02_dataset/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: ruff check pump_calculator tests

      - name: Run pytest (core, без ETL PDF — heavy deps)
        working-directory: backend
        run: |
          pytest -v \
            --ignore=tests/test_etl_pdf_antarus.py \
            --ignore=tests/test_etl_pdf_docling.py \
            --ignore=tests/test_etl_pdf_ksb.py \
            --ignore=tests/test_etl_pdf_pdfplumber.py \
            --ignore=tests/test_etl_pdf_qh.py \
            --ignore=tests/test_etl_pdf_splitter.py \
            --ignore=tests/test_etl_pdf_table.py \
            --ignore=tests/test_etl_pipeline.py \
            --ignore=tests/test_etl_cli.py
